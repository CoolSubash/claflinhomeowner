[alembic]
script_location = alembic
prepend_sys_path = .

# sqlalchemy.url is intentionally omitted here; env.py reads it from
# the application settings / DATABASE_URL environment variable so no
# credentials are hardcoded in this file.

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
